# EDIT THIS FILE for cylinder sweep ground truth. All lengths in METRES, mass in kg.
# Example only: 364 g -> mass: 0.364; centered CoM at 80 mm -> com_obj: [0.0, 0.0, 0.080].
# com_obj: [x,y,z] from BOTTOM CENTER on the table plane, +x along push, +z up.
# Axisymmetric mass distribution implies x=0; z must come from mass properties.
# base_w: shared full OUTER diameter (80 mm in the supplied variant meshes).
# Initial flat-support radius = base_w/2 - fillet_radius; derived automatically.
# For symmetric CoM x=0, this is the pivot-to-CoM horizontal distance in both modes.
# This upright reference does not model support migration during rolling.
# Radii: user-supplied probing-for-properties/figures/lineup.png, 2026-10-19;
# cylinder_a..e correspond to displayed C1..C5.
schema_version: 1
defaults:
  frame: bottom_center_x_along_push_z_up
  source: null  # e.g. scale + Onshape export, date, print/insert assumptions
  mesh: null  # optional; never inherit the legacy cylinder mesh for every radius
  mass: null
  com_obj: [0.0, 0.0, null]
  base_w: 0.080  # shared outer diameter; CAD mesh bounds checked 2026-10-19
  support_model: circular_base_fillet
  support_distances: {forward: null, press_pull: null}
  uncertainty:  # optional metadata; excluded from the paper's fixed-GT scoring
    mass: null
    com_obj: [null, null, null]
    base_w: null
    fillet_radius: null
configurations:
  cylinder_a:
    fillet_radius: 0.000
    mass: 0.365
    com_obj: [0.0, 0.0, 0.071]
    source: null
    mesh: meshes/cylinder_a.gltf
