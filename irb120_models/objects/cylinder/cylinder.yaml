  rpy: [0.0, 0.0, 0.0]
mass:
  value: 0.364
  sigma: null
  source: "object_params.json in irb120_control (uncommitted entry), migrated 2026-10-09."
com:
  value: null                # not yet known in the CAD frame; see 'recorded'
  sigma: null
  source: null
inertia:
  value: null
  source: null
tip_edges:
  default:
    point: [0.03, 0.0, 0.0]
    direction: [0.0, 1.0, 0.0]
friction:
  table_mu: null
  source: null
recorded:                    # CoM measured against the tip edge; used until com is set above
  edge: default
  com_from_edge: [0.0, 0.0, 0.1]   # [horizontal distance from the edge, 0, height]
